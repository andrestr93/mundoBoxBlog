details:
  - title: "Resistencia y Durabilidad"
    icon: "shield"
    content: "La <strong>durabilidad de las Nike Metcon 9</strong> es sobresaliente gracias a su placa <em>Hyperlift</em>. El refuerzo lateral de goma ha sido ampliado para mejorar el <strong>agarre en la cuerda (rope climbs)</strong>, evitando que el tejido se queme con la fricción."
  
  - title: "Comodidad y Ajuste"
    icon: "ripple"
    content: "En cuanto a la <strong>comodidad y el tallaje</strong>, la puntera es más espaciosa que en modelos anteriores, siendo perfectas si buscas <strong>zapatillas de Crossfit para pies anchos</strong>. El ajuste en el talón evita que el pie baile en ejercicios dinámicos."
  
  - title: "Estabilidad en Levantamientos"
    icon: "bolt"
    content: "El <strong>rendimiento en WODs pesados</strong> es donde brillan. Su drop mínimo ofrece una estabilidad total para hacer <strong>Snatch o Sentadillas</strong>. Además, la flexibilidad de la parte delantera permite realizar series de <em>Double Unders</em>."



